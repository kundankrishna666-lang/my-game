<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Racer</title>
<style>
:root{color-scheme:dark;--bg:#06070c;--p:#00e5ff;--a:#ff2d95;--y:#ffd23f;--g:rgba(255,255,255,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;justify-content:center}
#wrap{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;background:radial-gradient(circle at 50% 0,rgba(0,229,255,.2),transparent 60%),rgba(6,7,12,.9);backdrop-filter:blur(6px);text-align:center;overflow:auto}
.scr.on{display:flex}
h1{margin:0;font-size:36px;letter-spacing:3px;font-style:italic;background:linear-gradient(90deg,var(--p),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:4px 0 0;font-size:19px;letter-spacing:2px;color:var(--p)}
.b{font:inherit;font-weight:800;letter-spacing:1px;color:#fff;border:1px solid rgba(255,255,255,.2);background:var(--g);border-radius:14px;padding:13px 18px;width:100%;max-width:290px;font-size:15px;cursor:pointer}
.b.pri{background:linear-gradient(90deg,var(--p),#3b82ff);color:#001018;border:0;box-shadow:0 0 24px rgba(0,229,255,.45)}
.b.s{width:auto;padding:6px 12px;font-size:13px}
.card{width:100%;max-width:300px;box-sizing:border-box;background:var(--g);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;text-align:left;font-size:14px}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);margin:6px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--a))}
input{font:inherit;width:100%;max-width:290px;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:16px;user-select:text}
small{opacity:.7}
#nit{display:none;position:absolute;right:14px;bottom:18px;width:68px;height:68px;border-radius:50%;border:2px solid var(--a);background:rgba(255,45,149,.25);color:#fff;font-weight:800;font-size:12px;box-shadow:0 0 18px rgba(255,45,149,.6)}
</style></head><body>
<div id="wrap">
<canvas id="c" width="360" height="640"></canvas>
<button id="nit">🔥<br>NITRO</button>
<div class="scr on" id="menu"></div><div class="scr" id="miss"></div><div class="scr" id="set"></div><div class="scr" id="prof"></div><div class="scr" id="over"></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
const W=360,H=640,RX=50,LW=65,LN=4,PW=48,PH=86,PY=H-200,PI=Math.PI,FIN=3000;
const laneX=l=>RX+LW*l+LW/2;
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return h+''};
const defD=()=>({coins:0,best:0,dist:0,coll:0,runs:0,near:0,top:0,claimed:{},car:0,own:[0],snd:1,shk:1,dif:1,town:0,mode:0,wins:0});
let DB;try{DB=JSON.parse(localStorage.getItem('nrr'))}catch(e){}
DB=DB||{users:{},guest:{},cur:null};DB.users=DB.users||{};
DB.guest=Object.assign(defD(),DB.guest);for(const u in DB.users)DB.users[u].d=Object.assign(defD(),DB.users[u].d);
const save=()=>{try{localStorage.setItem('nrr',JSON.stringify(DB))}catch(e){}};
const D=()=>DB.cur&&DB.users[DB.cur]?DB.users[DB.cur].d:DB.guest;
const CARS=[{n:'Neon Cyan',c:'#00e5ff',p:0},{n:'Hot Pink',c:'#ff2d95',p:150},{n:'Solar Gold',c:'#ffd23f',p:300},{n:'Lime Volt',c:'#a3ff3f',p:500}];
const TH=[{n:'Neon Downtown',gr:'#0b0c14',e1:'#00e5ff',e2:'#ff2d95',rd:['#14161e','#242833'],night:1},{n:'Desert Highway',gr:'#c9a45c',e1:'#ffd23f',e2:'#ff8a3d',rd:['#3a3a3f','#4a4a50']},{n:'Snow Pass',gr:'#e8f0f7',e1:'#9fd8ff',e2:'#ffffff',rd:['#4a525e','#5d6672']},{n:'Coastal Drive',gr:'#2a9fd0',e1:'#ffffff',e2:'#ffd23f',rd:['#30343c','#40454e']}];
const EC=['#e5484d','#3e9bff','#9b6bff','#ff8a3d','#d0d4dc','#2fbf71'];
const MS=[{t:'Drive 2000 m in total',k:'dist',g:2000,r:100},{t:'Collect 60 coins',k:'coll',g:60,r:80},{t:'Reach 100 km/h',k:'top',g:100,r:50},{t:'Reach 200 km/h',k:'top',g:200,r:200},{t:'Make 20 near misses',k:'near',g:20,r:120},{t:'Play 5 races',k:'runs',g:5,r:60}];
let ac;function snd(f,t=.1,ty='sine'){if(!D().snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),n=ac.createGain();o.type=ty;o.frequency.value=f;n.gain.value=.06;o.connect(n);n.connect(ac.destination);o.start();n.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t);o.stop(ac.currentTime+t)}catch(e){}}
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));if(id)$(id).classList.add('on');$('nit').style.display=id?'none':'block'}
function menu(){const d=D();$('menu').innerHTML=`<h1>NEON RACER</h1><div class="card" style="text-align:center">👤 ${DB.cur||'Guest (anonymous)'}<br>🪙 ${d.coins} &nbsp;·&nbsp; 🏆 ${Math.floor(d.best)} m</div><button class="b s" onclick="cyc('mode')">MODE: ${['♾️ Endless','🏁 Bot Race'][d.mode]}</button><button class="b s" onclick="cyc('town')">🏙️ ${TH[d.town].n}</button><button class="b pri" onclick="play()">▶ PLAY</button><button class="b" onclick="missions()">🎯 MISSIONS</button><button class="b" onclick="online()">🌐 ONLINE</button><button class="b" onclick="garage()">🚗 GARAGE &amp; SETTINGS</button><button class="b" onclick="prof()">👤 PROFILE / LOGIN</button><small>0 → 200 km/h · dodge traffic · use nitro</small>`;show('menu')}
function missions(){const d=D();$('miss').innerHTML='<h2>🎯 MISSIONS</h2>'+MS.map((m,i)=>{const p=Math.min(d[m.k],m.g),dn=p>=m.g,cl=d.claimed[i];return `<div class="card"><b>${m.t}</b><span style="float:right;color:var(--y)">+${m.r} 🪙</span><div class="bar"><i style="width:${p/m.g*100}%"></i></div><small>${Math.floor(p)} / ${m.g}</small>${dn&&!cl?`<button class="b pri s" style="float:right" onclick="claim(${i})">CLAIM</button>`:cl?'<span style="float:right">✅</span>':''}</div>`}).join('')+'<button class="b" onclick="menu()">← BACK</button>';show('miss')}
function claim(i){const d=D();d.claimed[i]=1;d.coins+=MS[i].r;save();snd(900,.2);missions()}
const tog=(k,l)=>`<div class="card">${l}<button class="b s" style="float:right" onclick="tg('${k}')">${D()[k]?'ON':'OFF'}</button></div>`;
function tg(k){D()[k]^=1;save();garage()}
function dif(){const d=D();d.dif=(d.dif+1)%3;save();garage()}
function buy(i){const d=D(),c=CARS[i];if(d.own.includes(i))d.car=i;else if(d.coins>=c.p){d.coins-=c.p;d.own.push(i);d.car=i;snd(800,.2)}else snd(120,.2,'square');save();garage()}
function garage(){const d=D();$('set').innerHTML='<h2>🚗 GARAGE</h2>'+`<div class="card">🪙 ${d.coins} coins</div>`+CARS.map((c,i)=>`<div class="card" style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;border-radius:50%;background:${c.c};box-shadow:0 0 10px ${c.c}"></span><b style="flex:1">${c.n}</b><button class="b s" onclick="buy(${i})">${d.car==i?'✔ USING':d.own.includes(i)?'USE':c.p+' 🪙'}</button></div>`).join('')+'<h2>⚙️ SETTINGS</h2>'+tog('snd','Sound')+tog('shk','Screen shake')+`<div class="card">Difficulty<button class="b s" style="float:right" onclick="dif()">${['Easy','Normal','Hard'][d.dif]}</button></div><button class="b" onclick="menu()">← BACK</button>`;show('set')}
function prof(m=''){const d=D();$('prof').innerHTML=DB.cur?`<h2>👤 ${DB.cur}</h2><div class="card">🏆 Best: ${Math.floor(d.best)} m<br>🛣️ Total distance: ${Math.floor(d.dist)} m<br>🪙 Coins collected: ${d.coll}<br>🏁 Races: ${d.runs}<br>⚡ Top speed: ${Math.round(d.top)} km/h<br>😮 Near misses: ${d.near}</div><button class="b" onclick="DB.cur=null;save();menu()">LOG OUT</button><button class="b" onclick="menu()">← BACK</button>`:`<h2>👤 LOGIN</h2><small>Create a profile or login. Your coins, missions and cars are saved on this device under your name.</small><input id="un" placeholder="Username" maxlength="14" autocomplete="off"><input id="pw" type="password" placeholder="PIN / password (4+ characters)"><div style="color:var(--a);font-size:13px">${m}</div><button class="b pri" onclick="login()">LOGIN / CREATE</button><button class="b" onclick="menu()">PLAY AS GUEST (ANONYMOUS)</button>`;show('prof')}
function login(){const n=$('un').value.trim(),p=$('pw').value;if(!/^[A-Za-z0-9_ ]{2,14}$/.test(n)||p.length<4)return prof('Name: 2-14 letters or numbers. PIN: 4+ characters.');const u=DB.users[n];if(u){if(u.h!==hash(p))return prof('Wrong PIN.')}else DB.users[n]={h:hash(p),d:defD()};DB.cur=n;save();menu()}
let g=null,nit=false,ry0=0,last=performance.now();
const dk=()=>[.8,1,1.3][D().dif];
function play(on){const d=D();g={on:1,lane:1,px:laneX(1),kmh:0,dist:0,coll:0,near:0,en:[],co:[],tr:[],ts:3,sp:1.2,cs:.6,ry:0,nitro:60,fx:[],shake:0,t:0,mode:on?2:d.mode,bots:[],fin:0,lr:[0,1,2,3].map(()=>.35+Math.random()*.25)};
if(on)g.bots=[{x:laneX(0),tx:laneX(0),l:0,dist:0,kmh:0,c:'#ff2d95',done:0,net:1}];
else if(d.mode)g.bots=[0,2,3].map((l,i)=>({x:laneX(l),l,dist:(1-i)*4,kmh:0,cap:165+Math.random()*30+d.dif*12,c:EC[i+1],lt:2+i,done:0}));show(null)}
function move(d){if(g&&g.on)g.lane=Math.max(0,Math.min(LN-1,g.lane+d))}
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))move(-1);if(['ArrowRight','d','D'].includes(e.key))move(1);if([' ','ArrowUp','w','W'].includes(e.key))nit=true});
addEventListener('keyup',e=>{if([' ','ArrowUp','w','W'].includes(e.key))nit=false});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1)});
const nb=$('nit');nb.onpointerdown=e=>{e.stopPropagation();nit=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>nb.addEventListener(ev,()=>nit=false));
function boom(px,py,c){for(let i=0;i<30;i++)g.fx.push({x:px,y:py,vx:(Math.random()-.5)*400,vy:(Math.random()-.5)*400,l:.7,c})}
function over(fin){g.on=0;if(eg)eg.gain.value=0;const d=D();let pl=0,rw=0;
 if(fin){pl=1+g.fin;rw=[300,150,80,30][pl-1];d.coins+=rw;if(pl==1)d.wins++}else{g.shake=.5;snd(90,.5,'sawtooth');boom(g.px,PY,'#ff8a3d')}
 const nbst=g.dist>d.best&&!g.mode;if(!g.mode)d.best=Math.max(d.best,g.dist);d.dist+=g.dist;d.coll+=g.coll;d.coins+=g.coll;d.runs++;d.near+=g.near;d.top=Math.max(d.top,g.top||0);save();
 const cl=MS.filter((m,i)=>d[m.k]>=m.g&&!d.claimed[i]).length;
 setTimeout(()=>{$('over').innerHTML=`<h1>${fin?(pl==1?'🏆 YOU WIN!':'FINISHED P'+pl):'CRASHED'}</h1><div class="card" style="text-align:center;font-size:16px">📏 ${Math.floor(g.dist)} m ${nbst?'🏆 NEW BEST!':''}<br>🪙 +${g.coll+rw} coins${rw?' (prize '+rw+')':''} &nbsp; 😮 ${g.near} near misses<br>⚡ Top ${Math.round(g.top||0)} km/h</div>${cl?`<div class="card" style="text-align:center">🎯 ${cl} mission reward(s) ready!</div>`:''}${g.mode==2?'':'<button class="b pri" onclick="play()">↻ RETRY</button>'}${cl?'<button class="b" onclick="missions()">🎯 MISSIONS</button>':''}<button class="b" onclick="menu()">MENU</button>`;show('over')},900)}
function upd(dt){g.t+=dt;eng(g.kmh);const b=nit&&g.nitro>0,cap=b?240:200;
 if(g.kmh<cap)g.kmh=Math.min(cap,g.kmh+((cap-g.kmh)*.08+3+(b?14:0))*dt);else g.kmh=Math.max(cap,g.kmh-30*dt);
 g.nitro=b?g.nitro-25*dt:Math.min(100,g.nitro+4*dt);g.top=Math.max(g.top||0,g.kmh);
 const w=g.kmh*3.4;g.ry+=w*dt;g.dist+=g.kmh/3.6*dt;g.px+=(laneX(g.lane)-g.px)*Math.min(1,dt*14);
 if(g.kmh>15){g.sp-=dt;if(g.sp<=0){{const l=Math.random()*LN|0;if(!g.en.some(e=>e.l==l&&e.y<190)&&g.en.filter(e=>e.y<260).length<3)g.en.push({l,x:laneX(l),y:-110,r:g.lr[l],sy:Math.random()<.2?1.5:1,c:EC[Math.random()*EC.length|0]})};g.sp=((1.1-g.kmh/400)/dk())*(.7+Math.random()*.6)}}
 g.cs-=dt;if(g.cs<=0){{const l=Math.random()*LN|0;if(!g.en.some(e=>e.l==l&&e.y<300))g.co.push({x:laneX(l),l,y:-30,v:Math.random()<.1?5:1})};g.cs=.7+Math.random()*.7}
 for(const e of g.en){e.y+=w*e.r*dt;const dx=Math.abs(e.x-g.px),dy=Math.abs(e.y-PY);
  if(dx<PW-8&&dy<(PH*(1+e.sy))/2-12){over();return}
  if(!e.nm&&dx>PW&&dx<LW+8&&dy<PH*.5){e.nm=1;g.near++;g.nitro=Math.min(100,g.nitro+6);snd(600,.06);for(let i=0;i<6;i++)g.fx.push({x:e.x,y:e.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,l:.4,c:'#ffd23f'})}}
 for(const c of g.co){c.y+=w*dt;if(g.en.some(e=>e.l==c.l&&Math.abs(e.y-c.y)<(PH*e.sy)/2+16))c.got=1;if(!c.got&&Math.abs(c.x-g.px)<26&&Math.abs(c.y-PY)<38){c.got=1;g.coll+=c.v;g.nitro=Math.min(100,g.nitro+8);snd(1100,.08)}}
 g.ts-=dt;if(g.ts<=0&&g.kmh>40){{const l=Math.random()*LN|0;if(!g.en.some(e=>e.l==l&&e.y<450))g.tr.push({x:laneX(l),l,y:-40,t:Math.random()<.6?0:1})};g.ts=(4+Math.random()*3)/dk()}
 for(const t of g.tr){t.y+=w*dt;if(!t.hit&&Math.abs(t.x-g.px)<30&&Math.abs(t.y-PY)<34){t.hit=1;if(t.t){g.kmh*=.6;g.coll=Math.max(0,g.coll-10);g.shake=.3;snd(150,.2,'square')}else{g.kmh*=.75;g.lane=Math.max(0,Math.min(LN-1,g.lane+(Math.random()<.5?-1:1)));snd(200,.15,'triangle')}}}
 g.tr=g.tr.filter(t=>t.y<H+40);
 for(const b of g.bots){if(b.net){b.x+=(b.tx-b.x)*Math.min(1,dt*10);b.dist+=b.kmh/3.6*dt;if(!b.done&&b.dist>=FIN){b.done=1;g.fin++}continue}b.kmh+=((b.cap-b.kmh)*.08+3)*dt;b.dist+=b.kmh/3.6*dt;b.lt-=dt;if(b.lt<=0){const oc=[Math.abs(g.dist-b.dist)<28?g.lane:-1,...g.bots.filter(o=>o!==b&&Math.abs(o.dist-b.dist)<22).map(o=>o.l)],fr=[0,1,2,3].filter(l=>!oc.includes(l));if(fr.length)b.l=fr[Math.random()*fr.length|0];b.lt=2+Math.random()*3}b.x+=(laneX(b.l)-b.x)*Math.min(1,dt*6);if(!b.done&&b.dist>=FIN){b.done=1;g.fin++}}
 if(g.mode&&g.dist>=FIN){over(1);return}
 g.ns=(g.ns||0)-dt;if(g.mode==2&&conn&&g.ns<=0){g.ns=.1;try{conn.send({p:{d:g.dist,l:g.lane,k:g.kmh}})}catch(e){}}
 g.en=g.en.filter(e=>e.y<H+90);g.co=g.co.filter(c=>c.y<H+30&&!c.got);
 if(b&&Math.random()<.8)g.fx.push({x:g.px+(Math.random()-.5)*14,y:PY+PH/2,vx:(Math.random()-.5)*40,vy:200+Math.random()*100,l:.35,c:Math.random()<.5?'#ff2d95':'#ffd23f'})}
function car(cx,cy,c,pl,sy=1,rot=0){x.save();x.translate(cx,cy);x.rotate(rot);x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(5,8,31,54*sy,0,0,7);x.fill();x.scale(1.4,1.4*sy);const h=31,w=17,PW=34,PH=62;
 x.fillStyle='#0a0a0c';[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>x.fillRect(a*w-(a<0?4:2),b*18-8,6,16));
 if(pl){x.shadowColor=c;x.shadowBlur=24}
 x.fillStyle=c;x.beginPath();x.moveTo(-12,-h);x.lineTo(12,-h);x.quadraticCurveTo(w+2,-h+14,w,-6);x.lineTo(w,h-8);x.quadraticCurveTo(w,h,w-6,h);x.lineTo(-w+6,h);x.quadraticCurveTo(-w,h,-w,h-8);x.lineTo(-w,-6);x.quadraticCurveTo(-w-2,-h+14,-12,-h);x.fill();x.shadowBlur=0;
 x.fillStyle='rgba(0,0,0,.28)';x.fillRect(0,-h,w,PH);x.fillStyle='rgba(255,255,255,.2)';x.fillRect(-w+3,-h+8,4,PH-20);
 if(pl){x.fillStyle='rgba(255,255,255,.85)';x.fillRect(-2,-h,4,PH)}
 x.fillStyle='rgba(12,18,32,.92)';x.beginPath();x.roundRect(-11,-14,22,16,5);x.fill();x.fillRect(-10,h-18,20,7);
 x.fillStyle='rgba(0,0,0,.45)';x.fillRect(-w-2,h-8,PW+4,6);
 if(pl){x.fillStyle='#fff';x.beginPath();x.arc(0,-3,5,0,7);x.fill();x.fillStyle='#111';x.fillRect(-4,-5,8,3);x.fillStyle='#fff7b0';x.shadowColor='#fff7b0';x.shadowBlur=10;x.fillRect(-w+3,-h+1,7,4);x.fillRect(w-10,-h+1,7,4);x.shadowBlur=0}
 x.fillStyle='#ff2020';x.fillRect(-w+2,h-3,7,3);x.fillRect(w-9,h-3,7,3);x.restore()}
function gauge(k){const cx=76,cy=H-68,r=50;
 x.fillStyle='rgba(8,10,16,.88)';x.beginPath();x.arc(cx,cy,r+9,0,7);x.fill();
 x.lineWidth=7;x.lineCap='round';x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.arc(cx,cy,r,.75*PI,2.25*PI);x.stroke();
 const a=.75*PI+Math.min(k,240)/240*1.5*PI,col=k>200?'#ff2d95':'#00e5ff';
 x.strokeStyle=col;x.shadowColor=col;x.shadowBlur=12;x.beginPath();x.arc(cx,cy,r,.75*PI,a);x.stroke();x.shadowBlur=0;
 x.lineWidth=2;x.lineCap='butt';x.strokeStyle='rgba(255,255,255,.5)';for(let v=0;v<=240;v+=40){const t=.75*PI+v/240*1.5*PI;x.beginPath();x.moveTo(cx+Math.cos(t)*(r-12),cy+Math.sin(t)*(r-12));x.lineTo(cx+Math.cos(t)*(r-5),cy+Math.sin(t)*(r-5));x.stroke()}
 x.lineWidth=3;x.strokeStyle='#ff2d95';x.beginPath();x.moveTo(cx+Math.cos(a)*(r-28),cy+Math.sin(a)*(r-28));x.lineTo(cx+Math.cos(a)*(r-14),cy+Math.sin(a)*(r-14));x.stroke();
 x.fillStyle='#fff';x.font='bold 22px system-ui';x.textAlign='center';x.fillText(Math.round(k),cx,cy+8);x.font='9px system-ui';x.fillStyle='#9aa';x.fillText('KM/H',cx,cy+21)}
function draw(dt){
 x.save();if(g&&g.shake>0&&D().shk)x.translate((Math.random()-.5)*g.shake*20,(Math.random()-.5)*g.shake*20);
 const T=TH[D().town]||TH[0];
 x.fillStyle=T.gr;x.fillRect(-20,-20,W+40,H+40);
 if(!g)ry0+=120*dt;const ry=g?g.ry:ry0;scene(T,ry);
 const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,T.rd[0]);gr.addColorStop(1,T.rd[1]);x.fillStyle=gr;x.fillRect(RX,0,LW*LN,H);
 x.shadowBlur=12;x.shadowColor=T.e1;x.fillStyle=T.e1;x.fillRect(RX-3,0,3,H);x.shadowColor=T.e2;x.fillStyle=T.e2;x.fillRect(RX+LW*LN,0,3,H);x.shadowBlur=0;
 x.fillStyle='rgba(255,255,255,.55)';for(let l=1;l<LN;l++)for(let y=-60+ry%60;y<H;y+=60)x.fillRect(RX+LW*l-2,y,4,30);
 if(g){

function online(m=''){if(peer){try{peer.destroy()}catch(e){}peer=null;conn=null}$('set').innerHTML=`<h2>🌐 ONLINE RACE</h2><div class="card">1 vs 1 live race, 3000 m. One player creates a room, the other joins with the 4-letter code.</div><button class="b pri" onclick="host()">CREATE ROOM</button><input id="rc" placeholder="Room code" maxlength="4" style="text-transform:uppercase"><button class="b" onclick="join()">JOIN ROOM</button><div style="color:var(--y);font-size:13px">${m}</div><button class="b" onclick="menu()">← BACK</button>`;show('set')}
